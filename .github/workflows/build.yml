
name: Build Aura APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      - name: Extract and Build APK
        run: |
          unzip -q "aura (1).zip" -d aura-src
          PROJECT_DIR=$(dirname "$(find aura-src -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")
          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle settings file not found in ZIP"
            exit 1
          fi
          echo "Building from: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aura-APK
          path: '**/build/outputs/apk/debug/*.apk'
